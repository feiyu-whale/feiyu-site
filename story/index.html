<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>故事存档</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0a0c12;color:#c8d0e0;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;overflow:hidden;
}
/* 左侧章节列表 */
#side{
  width:230px;flex-shrink:0;height:100%;overflow-y:auto;
  background:#0d1018;border-right:1px solid #1c2333;
  padding:12px 0;
}
#side h1{
  font-size:13px;color:#5a6a8a;padding:0 14px 10px;
  font-weight:400;letter-spacing:1px;
}
.item{
  padding:8px 14px;font-size:12px;color:#7d8aa3;
  cursor:pointer;border-left:2px solid transparent;
  display:flex;justify-content:space-between;gap:6px;
}
.item:hover{background:#141a26;color:#a8b4cc}
.item.on{background:#151d2c;color:#5fd3f3;border-left-color:#5fd3f3}
.item .n{color:#3f4d66;font-size:11px}
/* 右侧主区 */
#main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
#bar{
  height:44px;flex-shrink:0;display:flex;align-items:center;
  padding:0 14px;gap:10px;border-bottom:1px solid #1c2333;
  background:#0c0f16;
}
#bar .t{font-size:12px;color:#5fd3f3;letter-spacing:1px}
#bar .c{margin-left:auto;font-size:11px;color:#465873}
#box{
  flex:1;overflow-y:auto;padding:20px 22px 90px;
  scroll-behavior:smooth;
}
.line{
  margin-bottom:18px;font-size:15px;line-height:1.85;
  color:#b3bed4;animation:fi .28s ease both;
}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.line .h{
  display:inline-block;font-size:11px;color:#5fd3f3;
  border:1px solid #1d4d5e;background:#0e1a20;
  padding:1px 6px;border-radius:3px;margin-right:7px;
  vertical-align:2px;
}
.line.narr{color:#7e8ba3;font-style:italic}
.line b{color:#e06a6a}
/* 底部控制 */
#foot{
  position:fixed;bottom:0;left:230px;right:0;
  height:62px;display:flex;align-items:center;gap:10px;
  padding:0 22px;background:linear-gradient(180deg,transparent,#0a0c12 40%);
}
.btn{
  padding:7px 16px;font-size:12px;border-radius:4px;cursor:pointer;
  background:#141a26;color:#8f9cb5;border:1px solid #232c3d;
  user-select:none;
}
.btn:hover{background:#1a2233;color:#5fd3f3;border-color:#2d5a6e}
.btn:disabled{opacity:.35;cursor:default}
#hint{margin-left:auto;font-size:11px;color:#3f4d66}
@media(max-width:700px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:.2s}
  #side.open{transform:none;box-shadow:0 0 30px #000}
  #foot{left:0}
  #menuBtn{display:block!important}
  .line{font-size:14px}
}
#menuBtn{display:none}
</style>
</head>
<body>
<div id="side"><h1>故事存档</h1><div id="list"></div></div>
<div id="main">
  <div id="bar">
    <span class="btn" id="menuBtn">☰</span>
    <span class="t" id="title">选择一个段落</span>
    <span class="c" id="counter"></span>
  </div>
  <div id="box"><div class="line narr">← 左侧选择一段，开始阅读</div></div>
  <div id="foot">
    <span class="btn" id="prev">上一段</span>
    <span class="btn" id="next">下一段</span>
    <span class="btn" id="play">自动播放</span>
    <span id="hint"></span>
  </div>
</div>
<script>
let DATA=[], cur=-1, idx=0, playing=false, timer=null;
const $=id=>document.getElementById(id);

fetch('playdata.json').then(r=>r.json()).then(d=>{
  DATA=d;
  const list=$('list');
  // 只显示有内容的
  d.forEach((g,i)=>{
    const el=document.createElement('div');
    el.className='item';
    el.dataset.i=i;
    el.innerHTML=`<span>#${g.id}</span><span class="n">${g.count}</span>`;
    el.onclick=()=>open(i);
    list.appendChild(el);
  });
  $('hint').textContent=`共 ${d.length} 段 / ${d.reduce((a,b)=>a+b.count,0)} 句`;
});

function open(i){
  cur=i; idx=0;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
  $('title').textContent='#'+DATA[i].id;
  $('side').classList.remove('open');
  renderAll();
}

function renderAll(){
  const g=DATA[cur]; if(!g) return;
  const box=$('box'); box.innerHTML='';
  for(let k=0;k<=idx && k<g.lines.length;k++){
    const ln=g.lines[k];
    const d=document.createElement('div');
    d.className='line'+(ln.who==null?' narr':'');
    const txt=esc(ln.text)
      .replace(/<color=#(\w+)>/g,'<b style="color:#$1">')
      .replace(/<\/color>/g,'</b>');
    d.innerHTML=(ln.who!=null?`<span class="h">${ln.who}</span>`:'')+txt.replace(/\n/g,'<br>');
    box.appendChild(d);
  }
  $('counter').textContent=`${idx+1} / ${g.lines.length}`;
  box.scrollTop=box.scrollHeight;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function step(n){
  if(cur<0) return;
  const g=DATA[cur];
  const t=idx+n;
  if(t>=g.lines.length){ stop(); return; }
  if(t<0){ idx=0; } else { idx=t; }
  renderAll();
}
function stop(){ playing=false; clearInterval(timer); timer=null; $('play').textContent='自动播放'; }

$('prev').onclick=()=>{stop(); step(-1)};
$('next').onclick=()=>{stop(); step(1)};
$('play').onclick=()=>{
  if(playing){ stop(); return; }
  if(cur<0){ open(0); }
  playing=true; $('play').textContent='暂停';
  timer=setInterval(()=>step(1), 2200);
};
$('menuBtn').onclick=()=>$('side').classList.toggle('open');
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); stop(); step(1); }
  if(e.key==='ArrowLeft'){ stop(); step(-1); }
});
</script>
</body>
</html>
