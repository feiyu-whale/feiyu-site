<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>深海塔防</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a1628;font-family:sans-serif;color:#cfe8ff;overflow-x:hidden;user-select:none}
#wrap{max-width:560px;margin:0 auto}
canvas{display:block;width:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;font-size:20px;font-weight:bold;pointer-events:none;text-shadow:0 0 6px #000}
#hud .hp{color:#ff6a6a}#hud .gold{color:#ffd54a}
#panel{display:flex;gap:6px;padding:6px;background:#0d2540}
.tb{min-width:60px;min-height:52px;flex:1;background:#12325a;border:2px solid #4a9eff;border-radius:8px;color:#fff;font-size:12px;cursor:pointer;text-align:center}
.tb b{font-size:16px;color:#ffd54a}
.tb.sel{background:#1d4a8a}
#ver{position:fixed;right:6px;bottom:4px;font-size:11px;color:#3a6a9a;z-index:9}
.ov{position:absolute;inset:0;background:rgba(5,12,25,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.ov h1{color:#4a9eff;font-size:34px;text-shadow:0 0 16px #4a9eff}
.ov p{font-size:14px;line-height:1.7}
.ov button{min-width:160px;min-height:52px;font-size:20px;background:#12325a;border:2px solid #4a9eff;color:#ffd54a;border-radius:10px;cursor:pointer}
.hidden{display:none}
#info{font-size:12px;color:#7ab8e8;min-height:18px;padding:0 8px 4px}
</style></head><body>
<div id="wrap" style="position:relative">
<canvas id="cv"></canvas>
<div id="hud"><span id="wv">波 0/15</span><span class="hp" id="hp">♥20</span><span class="gold" id="gd">◈120</span></div>
<div id="panel"></div>
<div id="info">点击格子建塔 · 点塔升级/出售</div>
<div id="start" class="ov"><h1>深海塔防</h1><p>守护左侧珊瑚巢！敌人从右侧沿水路游来。<br>选塔放在路旁格子，点塔可升级(3级)或出售。<br>每5波出现精英怪，共15波。</p><button id="go">开始游戏</button></div>
<div id="end" class="ov hidden"><h1 id="etitle">游戏结束</h1><p id="eresult"></p><button id="re">再来一局</button></div>
</div>
<div id="ver">v1.0.0-deepsea-tower-defense 20261109</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,scale=1;
function fit(){const p=document.getElementById('panel').offsetHeight;W=window.innerWidth;H=window.innerHeight-p-4;cv.width=W;cv.height=H;}
window.addEventListener('resize',()=>{fit();layout();});fit();
const TOWERS={jelly:{n:'水母塔',c:'#4a9eff',cost:60,r:70,dmg:0,slow:.5},coral:{n:'珊瑚炮',c:'#ff6a6a',cost:80,r:95,dmg:14},weed:{n:'海藻缠绕',c:'#3ddc84',cost:50,r:60,dmg:6},eel:{n:'电鳗塔',c:'#ffd54a',cost:110,r:110,dmg:18}};
const ORDER=['coral','weed','jelly','eel'];
const G={state:'menu',wave:0,hp:20,gold:120,towers:[],enemies:[],parts:[],bts:[],spawnQ:[],spawnT:0,betweenT:0,selType:null,selTower:null,cell:36,cols:0,path:[],score:0};
function layout(){const g=Math.min(34,Math.max(26,Math.floor(W/16)));G.cell=g;G.cols=Math.floor(W/g);const rows=Math.floor(H/g);
const mid=Math.floor(rows/2);G.path=[];const x0=G.cols-1,x2=3;
for(let x=x0;x>=x2;x--)G.path.push([x,mid]);for(let y=mid+1;y<=mid+2&&y<rows-1;y++)G.path.push([x2,y]);for(let x=x2+1;x<=x0;x++)G.path.push([x,mid+2>rows-1?mid:Math.min(mid+2,rows-1)]);}
layout();
function cellFree(cx,cy){for(const t of G.towers)if(t.cx===cx&&t.cy===cy)return null;for(let i=0;i<G.path.length-1;i++){const[a,b]=[G.path[i],G.path[i+1]];if(Math.abs(a[0]-cx)+Math.abs(a[1]-cy)<=(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])?2:0))return null;}let d=99;for(const p of G.path){d=Math.min(d,Math.abs(p[0]-cx)+Math.abs(p[1]-cy));}if(d<2)return null;return true;}
function px(cx,cy){return[(cx+.5)*G.cell,(cy+.5)*G.cell];}
const panel=document.getElementById('panel');
ORDER.forEach(k=>{const b=document.createElement('button');b.className='tb';b.dataset.k=k;b.innerHTML='<b>'+k[0].toUpperCase()+'</b><br>'+TOWERS[k].n+'<br>◈'+TOWERS[k].cost;b.onclick=()=>{G.selType=G.selType===k?null:k;updPanel();};panel.appendChild(b);});
function updPanel(){[...panel.children].forEach(b=>b.classList.toggle('sel',b.dataset.k===G.selType));document.getElementById('info').textContent=G.selTower?'点击面板升级/出售 · 再点塔取消':G.selType?'点击空格放置'+TOWERS[G.selType].n:'点击格子建塔 · 点塔升级/出售';}
function updHud(){document.getElementById('wv').textContent='波 '+G.wave+'/15';document.getElementById('hp').textContent='♥'+G.hp;document.getElementById('gd').textContent='◈'+G.gold;}
function startGame(){G.state='play';G.wave=0;G.hp=20;G.gold=120;G.towers=[];G.enemies=[];G.parts=[];G.bts=[];G.spawnQ=[];G.spawnT=0;G.betweenT=1.5;G.selType=null;G.selTower=null;G.score=0;updHud();updPanel();document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');}
document.getElementById('go').onclick=startGame;
document.getElementById('re').onclick=startGame;
function nextWave(){G.wave++;updHud();if(G.wave>15){win();return;}const n=8+G.wave*2;const elite=G.wave%5===0;G.spawnQ=[];for(let i=0;i<n;i++){const r=Math.random();let t='krill';if(r>.66)t='jellyfish';else if(r>.4&&G.wave>2)t='crab';G.spawnQ.push({t,elite:false});}
if(elite)G.spawnQ.push({t:'elite',elite:true});G.spawnT=0;}
function spawn(q){const hpB={krill:30,jellyfish:45,crab:70,elite:600}[q.t]*(1+G.wave*.15);
G.enemies.push({t:q.t,x:px(...G.path[0])[0],y:px(...G.path[0])[1],seg:0,prog:0,hp:hpB,mhp:hpB,spd:(q.t==='crab'?38:q.t==='elite'?70:48)*(1+G.wave*.03),slow:0,dot:0,dotT:0,r:q.t==='elite'?14:9,ph:Math.random()*6});}
function win(){G.state='over';document.getElementById('etitle').textContent='胜利！';document.getElementById('eresult').textContent='守住全部15波！击杀数：'+G.score;document.getElementById('end').classList.remove('hidden');}
function lose(){G.state='over';document.getElementById('etitle').textContent='珊瑚巢被摧毁';document.getElementById('eresult').textContent='到达第 '+G.wave+' 波 · 击杀数：'+G.score;document.getElementById('end').classList.remove('hidden');}
cv.addEventListener('pointerdown',e=>{if(G.state!=='play')return;const rect=cv.getBoundingClientRect();const mx=(e.clientX-rect.left),my=(e.clientY-rect.top);const cx=Math.floor(mx/G.cell),cy=Math.floor(my/G.cell);
let hit=null;for(const t of G.towers){const[tx,ty]=px(t.cx,t.cy);if(Math.hypot(tx-mx,ty-my)<G.cell*.7){hit=t;break;}}
if(hit){G.selTower=G.selTower===hit?null:hit;G.selType=null;}
else if(G.selType&&cellFree(cx,cy)){const d=TOWERS[G.selType];if(G.gold>=d.cost){G.gold-=d.cost;G.towers.push({k:G.selType,cx,cy,lvl:1,cd:0});G.selType=null;burst(...px(cx,cy),'#4a9eff',8);}else info('磷虾币不足！');}
else G.selTower=null;updHud();updPanel();});
function info(s){document.getElementById('info').textContent=s;setTimeout(()=>{if(G.state==='play')updPanel();},1200);}
function drawPanel2(){if(!G.selTower)return;const t=G.selTower,d=TOWERS[t.k];const up=Math.round(d.cost*.8*t.lvl);ctx.fillStyle='rgba(13,37,64,.95)';const px0=t.cx*G.cell-4,py0=(t.cy-2)*G.cell;if(t.cy<2)py0=(t.cy+2)*G.cell;const wpx=150,h=64;ctx.fillRect(px0,py0,wpx,h);ctx.strokeStyle='#4a9eff';ctx.strokeRect(px0,py0,wpx,h);ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText(d.n+' Lv'+t.lvl,px0+8,py0+16);ctx.fillStyle='#ffd54a';ctx.fillText('◈'+up,px0+8,py0+34);
G.bts=[{x:px0+8,y:py0+40,w:60,h:20,act:'up',label:'升级'},{x:px0+76,y:py0+40,w:60,h:20,act:'sell',label:'出售'}];
for(const b of G.bts){ctx.fillStyle=b.act==='up'?'#1d4a8a':'#5a1d2a';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#fff';ctx.fillText(b.label,b.x+14,b.y+15);}}
cv.addEventListener('pointerup',()=>{setTimeout(()=>{const bts=G.bts;for(const b of bts){}},0);});
document.getElementById('cv').addEventListener('pointerdown',function(e){if(!G.selTower||!G.bts.length)return;const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;for(const b of G.bts){if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){const t=G.selTower,d=TOWERS[t.k];
if(b.act==='up'){const cost=Math.round(d.cost*.8*t.lvl);if(t.lvl<3&&G.gold>=cost){G.gold-=cost;t.lvl++;burst(...px(t.cx,t.cy),'#ffd54a',12);}else info(t.lvl>=3?'已满级':'金币不足');}
else{G.gold+=Math.round(d.cost*.6*t.lvl);G.towers.splice(G.towers.indexOf(t),1);G.selTower=null;burst(...px(t.cx,t.cy),'#888',8);}
updHud();updPanel();G.bts=[];}}});
function burst(x,y,c,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.5+Math.random()*.4,c});}
function update(dt){G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});G.parts=G.parts.filter(p=>p.life>0);
if(G.state!=='play')return;
if(G.spawnQ.length===0){G.betweenT-=dt;if(G.betweenT<=0){nextWave();G.betweenT=6;}}
else{G.spawnT-=dt;if(G.spawnT<=0){spawn(G.spawnQ.shift());G.spawnT=.8;}}
for(const e of G.enemies){if(e.slow>0)e.slow-=dt;if(e.dotT>0){e.dotT-=dt;e.hp-=e.dot*dt;if(e.hp<=0)kill(e);}
const s=e.spd*(e.slow>0?.45:1);let m=s*dt/G.cell;while(m>0&&e.seg<G.path.length-1){const[a,b]=[G.path[e.seg],G.path[e.seg+1]];const dist=Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);const rem=1-e.prog;if(m<rem){e.prog+=m;m=0;}else{m-=rem;e.seg++;e.prog=0;}}
if(e.seg>=G.path.length-1){G.hp-=e.t==='elite'?5:1;e.hp=-1;updHud();burst(...px(...G.path[G.path.length-1]),'#ff6a6a',14);if(G.hp<=0){lose();return;}}}
G.enemies=G.enemies.filter(e=>e.hp>0);
for(const t of G.towers){const d=TOWERS[t.k];const[tx,ty]=px(t.cx,t.cy);t.cd-=dt;const rng=d.r*(1+.25*(t.lvl-1));
const inR=G.enemies.filter(e=>Math.hypot(e.x-tx,e.y-ty)<rng);
if(!inR.length)continue;
if(t.k==='jelly'){if(t.cd<=0){inR.forEach(e=>e.slow=1.5);t.cd=1;inR.forEach(e=>burst(e.x,e.y,'#4a9eff',2));}}
else if(t.k==='weed'){if(t.cd<=0){inR[0].dot=d.dmg*t.lvl*.4;inR[0].dotT=2;t.cd=1;}}
else if(t.k==='coral'){if(t.cd<=0){const e=inR[0];e.hp-=d.dmg*t.lvl;t.cd=.9;burst(e.x,e.y,'#ff6a6a',4);if(e.hp<=0)kill(e);}}
else if(t.k==='eel'){if(t.cd<=0){let e=inR[0];let chain=[e],cur=e;for(let i=0;i<t.lvl;i++){const nx=G.enemies.filter(o=>o!==cur&&o.hp>0&&!chain.includes(o)&&Math.hypot(o.x-cur.x,o.y-cur.y)<70);if(nx.length){chain.push(nx[0]);cur=nx[0];}}
chain.forEach((o,i)=>{o.hp-=d.dmg*(1-i*.15);burst(o.x,o.y,'#ffd54a',3);if(o.hp<=0)kill(o);});t.cd=1.4;}}}
G.enemies=G.enemies.filter(e=>e.hp>0);}
function kill(e){e.hp=-1;G.score++;const g=e.t==='elite'?80:e.t==='crab'?14:8;G.gold+=g;burst(e.x,e.y,'#ffd54a',6);updHud();}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1628');g.addColorStop(1,'#0d2540');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(74,158,255,.06)';for(let x=0;x<W;x+=G.cell){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=G.cell){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
ctx.fillStyle='rgba(74,158,255,.10)';ctx.beginPath();const p0=px(...G.path[0]);ctx.moveTo(p0[0],p0[1]-G.cell/2);for(let i=1;i<G.path.length;i++){const p=px(...G.path[i]);ctx.lineTo(p[0],p[i>0&&G.path[i][1]!==G.path[i-1][1]?p[1]+G.cell*(G.path[i][1]>G.path[i-1][1]?-1:1)*1.5-0:p[1]-G.cell/2]);}
ctx.lineTo(px(...G.path[G.path.length-1])[0],px(...G.path[G.path.length-1])[1]+G.cell/2);ctx.lineTo(p0[0],p0[1]+G.cell/2);ctx.closePath();ctx.fill();
const hb=px(...G.path[G.path.length-1]);const pu=Math.sin(performance.now()/400)*3;
ctx.fillStyle='#2a7a4a';ctx.beginPath();ctx.arc(hb[0],hb[1],G.cell*.8+pu,0,7);ctx.fill();
ctx.fillStyle='#ff6a6a';for(let i=0;i<5;i++){const a=i/5*6.28+pu/5;ctx.beginPath();ctx.arc(hb[0]+Math.cos(a)*G.cell*.4,hb[1]+Math.sin(a)*G.cell*.4,4,0,7);ctx.fill();}
ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('♥'+Math.max(0,G.hp),hb[0]-12,hb[1]+4);
for(const e of G.enemies){e.ph+=.1;const wob=Math.sin(e.ph)*2;ctx.save();ctx.translate(e.x,e.y+wob);
if(e.t==='krill'){ctx.fillStyle='#8fd0ff';ctx.beginPath();ctx.ellipse(0,0,e.r,e.r*.6,0,0,7);ctx.fill();}
else if(e.t==='jellyfish'){ctx.fillStyle='rgba(180,140,255,.85)';ctx.beginPath();ctx.arc(0,0,e.r,Math.PI,0);ctx.fill();ctx.strokeStyle='rgba(180,140,255,.6)';for(let i=-1;i<2;i++){ctx.beginPath();ctx.moveTo(i*4,e.r*.2);ctx.quadraticCurveTo(i*4+Math.sin(e.ph+i)*3,e.r,i*4,e.r+6);ctx.stroke();}}
else if(e.t==='crab'){ctx.fillStyle='#ff8a5a';ctx.fillRect(-e.r,-e.r*.6,e.r*2,e.r*1.2);ctx.strokeStyle='#ff8a5a';ctx.beginPath();ctx.moveTo(e.r,0);ctx.lineTo(e.r+6,-5);ctx.moveTo(-e.r,0);ctx.lineTo(-e.r-6,5);ctx.stroke();}
else{ctx.fillStyle='#c33';ctx.beginPath();ctx.arc(0,0,e.r+2+Math.sin(e.ph*2)*1.5,0,7);ctx.fill();ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(0,0,e.r*.5,0,7);ctx.fill();}
if(e.slow>0){ctx.strokeStyle='rgba(74,158,255,.7)';ctx.beginPath();ctx.arc(0,0,e.r+4,0,7);ctx.stroke();}
ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(-e.r,-e.r-8,e.r*2,3);ctx.fillStyle='#3ddc84';ctx.fillRect(-e.r,-e.r-8,e.r*2*Math.max(0,e.hp/e.mhp),3);ctx.restore();}
for(const t of G.towers){const[tx,ty]=px(t.cx,t.cy);const d=TOWERS[t.k];ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(tx,ty,G.cell*.32+t.lvl*2,0,7);ctx.fill();
if(t.k==='jelly'){ctx.strokeStyle=d.c;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(tx-4+i*4,ty+3);ctx.quadraticCurveTo(tx-4+i*4+Math.sin(performance.now()/300+i)*3,ty+8,tx-4+i*4,ty+11);ctx.stroke();}}
else if(t.k==='coral'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tx,ty,3+t.lvl,0,7);ctx.fill();}
else if(t.k==='weed'){ctx.strokeStyle='#3ddc84';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx+Math.sin(performance.now()/500+i*2)*6,ty-8,tx+Math.sin(performance.now()/500+i*2)*8,ty-14);ctx.stroke();}}
else{ctx.strokeStyle='#ffd54a';ctx.beginPath();ctx.moveTo(tx-5,ty-5);ctx.lineTo(tx+3,ty-1);ctx.lineTo(tx-2,ty+1);ctx.lineTo(tx+5,ty+5);ctx.stroke();}
if(G.selTower===t){ctx.strokeStyle='#ffd54a';ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(tx,ty,d.r*(1+.25*(t.lvl-1)),0,7);ctx.stroke();ctx.setLineDash([]);}}
G.parts.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;});
drawPanel2();}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
