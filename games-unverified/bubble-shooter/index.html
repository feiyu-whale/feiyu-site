<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1,user-scalable=no"><title>泡泡龙</title><style>html,body{margin:0;padding:0;background:#0a1628;color:#fff;font-family:sans-serif;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}#wrap{display:flex;flex-direction:column;align-items:center;height:100vh}#hud{width:100%;max-width:420px;display:flex;justify-content:space-between;padding:6px 14px;box-sizing:border-box;font-size:15px;color:#9fc6ff}#hud b{font-size:24px;color:#ffd54a;display:block;line-height:1}#stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center}canvas{background:#0d2540;border-radius:8px;touch-action:none}#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,12,25,.88);text-align:center;padding:20px;box-sizing:border-box}#ov h1{color:#4a9eff;font-size:34px;margin:0 0 10px}#ov p{color:#9fc6ff;font-size:14px;max-width:300px;line-height:1.6}#ov .btn{margin-top:18px;padding:14px 40px;font-size:18px;border:0;border-radius:8px;background:#ffd54a;color:#0a1628;min-width:44px;min-height:44px;cursor:pointer}#ver{position:fixed;right:6px;bottom:6px;font-size:11px;color:#3d5a80}</style></head><body><div id="wrap"><div id="hud"><div>分数<b id="hs">0</b></div><div>关卡<b id="hl">1</b></div><div>剩余泡泡<b id="hb">30</b></div></div><div id="stage"><canvas id="cv"width="360"height="560"></canvas><div id="ov"><h1>泡泡龙</h1><p>底部发射器发射彩色泡泡，墙壁可反弹。<br>三个以上同色相连即消除，悬空泡泡会掉落。<br>清空所有泡泡进入下一关，每关颜色更多！</p><button class="btn"id="bt">开始游戏</button></div></div></div><div id="ver">v1.0.0-bubble-shooter 20261109</div><script>const W=360,H=560,R=15,SP=30,HROW=26,TOP=20,COLS=11,SHOTS=30;const COL=['#ff5c5c','#ffd54a','#4ade80','#4a9eff','#c084fc','#ff9d4a'];const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let G={};function fit(){const s=document.getElementById('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}window.addEventListener('resize',fit);fit();const key=(r,c)=>r*100+c;function get(r,c){const g=G.grid.get(key(r,c));return g===undefined?-1:g}function cx(r,c){return c*SP+(r%2)*R}function cy(r){return TOP+R+r*HROW}function nbrs(r,c){const o=r%2?[-1,0]:[0,1];return[[r,c-1],[r,c+1],[r-1,c+o[0]],[r-1,c+o[1]],[r+1,c+o[0]],[r+1,c+o[1]]]}function newGame(){G={run:1,score:0,level:1,shots:SHOTS,nc:3,grid:new Map(),maxR:0,ang:0,p:null,next:0,parts:[],anim:0};buildLevel();G.next=rand();updHUD()}function buildLevel(){G.grid=new Map();G.maxR=0;for(let r=0;r<5;r++){for(let c=0;c<COLS;c++){if(Math.random()<0.92)G.grid.set(key(r,c),Math.floor(Math.random()*G.nc));G.maxR=r}}G.shots=SHOTS}function rand(){return Math.floor(Math.random()*G.nc)}function updHUD(){hs.textContent=G.score;hl.textContent=G.level;hb.textContent=G.shots}function shoot(){if(!G.run||G.p)return;if(G.shots<=0)return;G.p={x:W/2,y:H-42,vx:Math.sin(G.ang)*420,vy:-Math.cos(G.ang)*420,col:G.next};G.next=rand();G.shots--;updHUD()}function pop(x,y,col,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,l:.6+Math.random()*.4,col})}function snap(p){let best=null,bd=1e9;for(let r=0;r<=G.maxR+2;r++){const ry=cy(r);if(ry>H-120)break;const off=(r%2)*R,c0=Math.round((p.x-off)/SP);for(let dc=-1;dc<=1;dc++){const c=c0+dc;if(c<0||c>=COLS||get(r,c)>=0)continue;const d=(p.x-cx(r,c))**2+(p.y-ry)**2;if(d<bd){bd=d;best=[r,c]}}}if(!best)return;const[r,c]=best;G.grid.set(key(r,c),p.col);G.p=null;if(r>G.maxR)G.maxR=r;if(cy(r)>H-120){over();return}resolve(r,c)}function resolve(r,c){const col=get(r,c),st=[[r,c]],seen=new Set([key(r,c)]),m=[];while(st.length){const[a,b]=st.pop();m.push([a,b]);for(const[x,y]of nbrs(a,b)){if(get(x,y)===col&&!seen.has(key(x,y))){seen.add(key(x,y));st.push([x,y])}}}if(m.length>=3){for(const[a,b]of m){G.grid.delete(key(a,b));pop(cx(a,b),cy(a,b),COL[col],6)}G.score+=m.length*10}else m.length=0;const keep=new Set(),st2=[];for(let c2=0;c2<COLS;c2++)if(get(0,c2)>=0){keep.add(key(0,c2));st2.push([0,c2])}while(st2.length){const[a,b]=st2.pop();for(const[x,y]of nbrs(a,b)){if(get(x,y)>=0&&!keep.has(key(x,y))){keep.add(key(x,y));st2.push([x,y])}}}let drop=0;for(const k of[...G.grid.keys()]){if(!keep.has(k)){const r2=Math.floor(k/100),c2=k%100;pop(cx(r2,c2),cy(r2,c2),COL[get(r2,c2)],8);G.grid.delete(k);drop++}}if(drop)G.score+=drop*20;updHUD();if(G.grid.size===0){G.level++;G.nc=Math.min(G.nc+1,6);G.score+=100;buildLevel();G.next=rand();updHUD()}else if(G.shots<=0)over()}function over(){G.run=0;bt.textContent='再来一局';ovp.textContent='最终分数：'+G.score+'　到达关卡：'+G.level;ov.style.display='flex'}function update(dt){G.anim+=dt;if(G.p){const p=G.p;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<R){p.x=R;p.vx*=-1}if(p.x>W-R){p.x=W-R;p.vx*=-1}if(p.y<TOP+R){snap(p);return}let hit=0;for(const k of G.grid.keys()){const r=Math.floor(k/100),c=k%100;if((p.x-cx(r,c))**2+(p.y-cy(r,c))**2<(SP-3)**2){hit=1;break}}if(hit)snap(p)}for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.l-=dt;if(q.l<=0)G.parts.splice(i,1)}}function drawBub(x,y,col,r){ctx.fillStyle=COL[col];ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(x-r*.3,y-r*.35,r*.32,0,7);ctx.fill()}function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1628');g.addColorStop(1,'#0d2540');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(74,158,255,.35)';ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(W,TOP);ctx.stroke();if(G.run&&!G.p){const dx=Math.sin(G.ang),dy=-Math.cos(G.ang);let x=W/2,y=H-42,vx=dx,vy=dy;ctx.fillStyle='rgba(255,213,74,.6)';for(let i=0;i<40;i++){x+=vx*11;y+=vy*11;if(x<R||x>W-R){vx*=-1;x=Math.max(R,Math.min(W-R,x))}if(y<TOP+R)break;if(i%3===0){ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill()}}}for(const k of G.grid.keys()){const r=Math.floor(k/100),c=k%100;const s=1+Math.sin(G.anim*3+r+c)*.04;drawBub(cx(r,c),cy(r,c),get(r,c),R*s)}for(const q of G.parts){ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=COL[q.col];ctx.beginPath();ctx.arc(q.x,q.y,4,0,7);ctx.fill()}ctx.globalAlpha=1;if(G.run){ctx.save();ctx.translate(W/2,H-42);ctx.rotate(G.ang);ctx.fillStyle='#4a9eff';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(14,14);ctx.lineTo(-14,14);ctx.closePath();ctx.fill();ctx.restore();if(G.p)drawBub(G.p.x,G.p.y,G.p.col,R);else drawBub(W/2,H-42,G.next,R);drawBub(40,H-42,G.next,R);ctx.fillStyle='#9fc6ff';ctx.font='11px sans-serif';ctx.fillText('下一颗',24,H-14);ctx.fillStyle='rgba(255,92,92,.5)';ctx.fillRect(0,H-120,W,2)}}let last=0;function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;if(G.run)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function aim(e){const b=cv.getBoundingClientRect(),k=W/b.width;const x=(e.clientX-b.left)*k,y=(e.clientY-b.top)*k;let a=Math.atan2(x-W/2,H-42-y);G.ang=Math.max(-1.35,Math.min(1.35,a))}cv.addEventListener('pointermove',e=>{if(G.run)aim(e)});cv.addEventListener('pointerdown',e=>{if(G.run)aim(e)});cv.addEventListener('pointerup',e=>{if(G.run){aim(e);shoot()}});document.addEventListener('keydown',e=>{if(!G.run)return;if(e.code==='ArrowLeft'||e.code==='KeyA')G.ang=Math.max(-1.35,G.ang-.12);else if(e.code==='ArrowRight'||e.code==='KeyD')G.ang=Math.min(1.35,G.ang+.12);else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){shoot();e.preventDefault()}});const ov=document.getElementById('ov'),ovp=ov.querySelector('p'),bt=document.getElementById('bt');bt.onclick=()=>{ov.style.display='none';newGame()};G={run:0,score:0,level:1,shots:SHOTS,nc:3,grid:new Map(),maxR:0,ang:0,p:null,next:0,parts:[],anim:0};updHUD();</script></body></html>
