<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>鲸落跑酷</title><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:sans-serif;-webkit-user-select:none;user-select:none}#c{display:block;width:100vw;height:100vh;touch-action:none}#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:rgba(10,22,40,.85);z-index:9}#ov h1{color:#4a9eff;font-size:34px;margin:0 0 10px;text-shadow:0 0 20px #4a9eff}#ov p{font-size:14px;color:#9fc6e8;margin:4px 0;max-width:320px;line-height:1.6}#ov button{margin-top:16px;padding:14px 40px;font-size:18px;min-width:44px;min-height:44px;border:2px solid #ffd54a;border-radius:24px;background:#0d2540;color:#ffd54a;cursor:pointer}#ov button:active{background:#ffd54a;color:#0a1628}#vb{position:fixed;right:6px;bottom:6px;color:#5a7a9a;font-size:11px;z-index:10}.hl{color:#ffd54a}</style></head><body><canvas id="c"></canvas><div id="ov"><div id="ti"><h1>🐳 鲸落跑酷</h1><p>空格/点击控制小鲸鱼上浮，松手下潜。躲避渔网、岩石、水母和鲨鱼，收集磷虾得金币。</p><p>护盾可免一次碰撞，气泡会加速哦！</p></div><button id="bt">开 始</button></div><div id="vb">v1.0.0-whale-run 20261109</div><script>var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=0,H=0;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);var S={st:0,hp:3,gd:0,dist:0,lv:1,t:0,sp:280,x:0,y:0,vy:0,up:false,sh:0,ob:[],it:[],pt:[],bs:[],st2:0,hi:+(localStorage.getItem('wh_hi')||0),gn:0};var keys=[];function tap(e){e.preventDefault();if(S.st===0){go()}else if(S.st===1){S.up=true}else if(S.st===2){go()}}function rel(e){e.preventDefault();S.up=false}cv.addEventListener('touchstart',tap,{passive:false});cv.addEventListener('touchend',rel,{passive:false});cv.addEventListener('mousedown',tap);addEventListener('mouseup',rel);addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(S.st===0||S.st===2)go();else S.up=true}});addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')S.up=false});var bt=document.getElementById('bt'),ov=document.getElementById('ov');bt.onclick=go;function go(){S.st=1;S.hp=3;S.gd=0;S.dist=0;S.lv=1;S.t=0;S.sp=280;S.x=90;S.y=H*0.5;S.vy=0;S.up=false;S.sh=0;S.ob=[];S.it=[];S.pt=[];S.bs=[];S.gn=0;ov.style.display='none'}function end(){S.st=2;if(S.dist>S.hi){S.hi=Math.floor(S.dist);localStorage.setItem('wh_hi',S.hi)}document.getElementById('ti').innerHTML='<h1>💔 游戏结束</h1><p>距离 <span class="hl">'+Math.floor(S.dist)+'m</span> ｜ 金币 <span class="hl">'+S.gd+'</span><br>最高纪录 <span class="hl">'+S.hi+'m</span></p>';bt.textContent='再来一局';ov.style.display='flex'}function coll(o,x,y,r){var dx=o.x-x,dy=o.y-y,d=o.r+r;return dx*dx+dy*dy<d*d}function spawn(dt){S.gn-=dt;if(S.gn<=0){S.gn=1.6-Math.min(0.9,S.t*0.02);var k=Math.random(),sy=H*0.2+Math.random()*H*0.6;var type=k<0.3?0:(k<0.5?1:(k<0.72?2:3));S.ob.push({x:W+60,y:sy,r:type===0?46:(type===1?34:(type===2?30:38)),t:type,a:Math.random()*6.28,ph:Math.random()*6.28,vy:type===2?Math.sin(Math.random()*6.28)*40:(type===3?(Math.random()-0.5)*80:0)})}S.ig=(S.ig||0)-dt;if(S.ig<=0){S.ig=1.2;var ik=Math.random(),iy=H*0.15+Math.random()*H*0.7;if(ik<0.6)S.it.push({x:W+40,y:iy,r:12,t:0,a:Math.random()*6.28});else if(ik<0.85)S.it.push({x:W+40,y:iy,r:14,t:1,a:0});else S.it.push({x:W+40,y:iy,r:16,t:2,a:0})}}function hit(){if(S.sh>0){S.sh=0;boom(S.x,S.y,'#4a9eff');return}S.hp--;boom(S.x,S.y,'#ff6a6a');if(S.hp<=0)end()}function boom(x,y,c){for(var i=0;i<14;i++)S.pt.push({x:x,y:y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,l:0.6,c:c})}function update(dt){S.t+=dt;S.dist+=S.sp*dt/50;S.lv=1+Math.floor(S.t/15);S.sp=280+Math.min(340,S.t*11);var tgt=S.up?H*0.12:H*0.8;S.vy+=(tgt-S.y)*2.4*dt;S.vy*=Math.pow(0.02,dt);S.y+=S.vy*dt;if(S.sh>0)S.sh-=dt;spawn(dt);var i,j,o;for(i=S.ob.length-1;i>=0;i--){o=S.ob[i];o.x-=(S.sp+(o.t===3?90:0))*dt;o.a+=dt*3;o.y+=o.vy*dt;if(o.t===2)o.y+=Math.sin(o.a)*40*dt;if(o.x<-80){S.ob.splice(i,1);continue}if(coll(o,S.x,S.y,16)){S.ob.splice(i,1);hit()}}for(i=S.it.length-1;i>=0;i--){o=S.it[i];o.x-=S.sp*dt;o.a+=dt*4;if(o.x<-40){S.it.splice(i,1);continue}if(coll(o,S.x,S.y,20)){if(o.t===0){S.gd++;boom(o.x,o.y,'#ff9a6a')}else if(o.t===1){S.sh=6;boom(o.x,o.y,'#4a9eff')}else{S.sp+=60;boom(o.x,o.y,'#7de8ff')}S.it.splice(i,1)}}for(i=S.pt.length-1;i>=0;i--){o=S.pt[i];o.l-=dt;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.l<=0)S.pt.splice(i,1)}if(Math.random()<dt*8)S.bs.push({x:Math.random()*W,y:H+10,r:2+Math.random()*4,v:40+Math.random()*60});for(i=S.bs.length-1;i>=0;i--){o=S.bs[i];o.y-=o.v*dt;if(o.y<-10)S.bs.splice(i,1)}}function fish(y,fl,col,s){cx.fillStyle=col;cx.beginPath();cx.ellipse(S.x,y,30*s,18*s,0,0,6.28);cx.fill();cx.beginPath();cx.moveTo(S.x-28*s,y);cx.lineTo(S.x-46*s,y-14*s*fl);cx.lineTo(S.x-46*s,y+14*s*fl);cx.closePath();cx.fill();cx.fillStyle='#0a1628';cx.beginPath();cx.arc(S.x+16*s,y-6*s,4*s,0,6.28);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.arc(S.x+8*s,y+6*s,7*s,-0.5,2);cx.stroke()}function draw(){var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1628');g.addColorStop(1,'#0d2540');cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.fillStyle='rgba(180,220,255,0.12)';var i,o;for(i=0;i<S.bs.length;i++){o=S.bs[i];cx.beginPath();cx.arc(o.x,o.y,o.r,0,6.28);cx.fill()}if(S.st===0){fish(H*0.45,Math.sin(Date.now()/300)*0.5+1,'#4a9eff',1.4);return}cx.fillStyle='rgba(60,110,160,0.35)';cx.beginPath();cx.moveTo(0,H*0.9);for(i=0;i<=W;i+=40)cx.lineTo(i,H*0.9+Math.sin(i/60+Date.now()/600)*14);cx.lineTo(W,H);cx.lineTo(0,H);cx.fill();for(i=0;i<S.ob.length;i++){o=S.ob[i];cx.save();cx.translate(o.x,o.y);if(o.t===0){cx.fillStyle='#5a7a8a';cx.fillRect(-8,-o.r,16,o.r*2);cx.strokeStyle='#8a6a4a';cx.lineWidth=3;for(var k=-2;k<=2;k++){cx.beginPath();cx.moveTo(8,o.r*k*0.4-8);cx.quadraticCurveTo(o.r,0,8,-(o.r*k*0.4-8));cx.stroke()}}else if(o.t===1){cx.fillStyle='#4a5a6a';cx.beginPath();cx.moveTo(-o.r,o.r);cx.lineTo(-o.r*0.3,-o.r);cx.lineTo(o.r*0.4,-o.r*0.6);cx.lineTo(o.r,o.r);cx.fill()}else if(o.t===2){cx.fillStyle='rgba(255,120,180,0.75)';cx.beginPath();cx.arc(0,0,o.r*0.55,0,6.28);cx.fill();var n=6;for(k=0;k<n;k++){var an=k*1.05+o.a,sy2=o.r*0.4;cx.strokeStyle='rgba(255,120,180,0.6)';cx.lineWidth=4;cx.beginPath();cx.moveTo(Math.cos(an)*o.r*0.5,Math.sin(an)*o.r*0.5);cx.quadraticCurveTo(Math.cos(an)*o.r,Math.sin(an)*o.r+Math.sin(o.a*2+k)*10,Math.cos(an)*o.r*1.2+Math.cos(o.a+k)*8,Math.sin(an)*o.r*1.5+sy2);cx.stroke()}}else{cx.fillStyle='#8a9ab0';cx.beginPath();cx.moveTo(-o.r,0);cx.lineTo(-o.r*0.3,-o.r*0.5);cx.lineTo(o.r*0.5,-o.r*0.45);cx.lineTo(o.r,0);cx.lineTo(o.r*0.4,o.r*0.5);cx.lineTo(-o.r*0.3,o.r*0.5);cx.closePath();cx.fill();cx.fillStyle='#eaf4ff';cx.beginPath();cx.moveTo(-o.r*0.6,2);cx.lineTo(o.r*0.9,2);cx.lineTo(o.r*0.8,8);cx.lineTo(-o.r*0.5,8);cx.fill();cx.fillStyle='#ffd54a';cx.beginPath();cx.arc(0,-o.r*0.7,3,0,6.28);cx.fill()}cx.restore()}for(i=0;i<S.it.length;i++){o=S.it[i];cx.save();cx.translate(o.x,o.y+Math.sin(o.a)*6);if(o.t===0){cx.fillStyle='#ff9a6a';for(var m=0;m<4;m++){cx.beginPath();cx.ellipse(m*7-10,0,6,3,0.3,0,6.28);cx.fill()}}else if(o.t===1){cx.strokeStyle='#4a9eff';cx.lineWidth=3;cx.beginPath();cx.arc(0,0,15,0,6.28);cx.stroke();cx.beginPath();cx.arc(0,0,9,0,6.28);cx.stroke()}else{cx.fillStyle='#7de8ff';cx.beginPath();cx.arc(0,0,12,0,6.28);cx.fill();cx.fillStyle='rgba(255,255,255,0.7)';cx.beginPath();cx.arc(-4,-4,4,0,6.28);cx.fill()}cx.restore()}var fl2=S.up?1:-1;fish(S.y,fl2,'#4a9eff',1);if(S.sh>0){cx.strokeStyle='rgba(74,158,255,'+(0.4+0.3*Math.sin(Date.now()/100))+')';cx.lineWidth=3;cx.beginPath();cx.arc(S.x,S.y,44,0,6.28);cx.stroke()}for(i=0;i<S.pt.length;i++){o=S.pt[i];cx.globalAlpha=o.l/0.6;cx.fillStyle=o.c;cx.beginPath();cx.arc(o.x,o.y,4,0,6.28);cx.fill()}cx.globalAlpha=1;cx.fillStyle='#fff';cx.font='bold 26px sans-serif';cx.textAlign='left';cx.fillText(Math.floor(S.dist)+'m',16,38);cx.fillStyle='#ffd54a';cx.fillText('🪙'+S.gd,16,72);cx.fillStyle='#4a9eff';cx.fillText('Lv.'+S.lv,W-90,38);for(i=0;i<3;i++){cx.fillStyle=i<S.hp?'#ff6a6a':'rgba(255,255,255,0.2)';cx.beginPath();cx.arc(W-40-i*32,32,11,0,6.28);cx.fill()}if(S.sh>0){cx.fillStyle='#4a9eff';cx.font='16px sans-serif';cx.fillText('🛡 '+S.sh.toFixed(1)+'s',W-120,72)}}var lt=0;function loop(ts){var dt=Math.min(0.05,(ts-lt)/1000);lt=ts;if(S.st===1)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
