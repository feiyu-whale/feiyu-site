<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>变速变调</title>
<style>
  :root{--bg:#0a0f1a;--panel:#111a2b;--line:#1e2a41;--fg:#dbe7f5;--dim:#7b8ba3;--acc:#4aa8ff;--acc2:#7d5cff;--ok:#3ddc97;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
  header{padding:16px 18px 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,rgba(74,168,255,.14),rgba(125,92,255,.12))}
  header h1{margin:0;font-size:17px}
  header p{margin:4px 0 0;font-size:11px;color:var(--dim)}
  .back{color:var(--acc);text-decoration:none;font-size:12px;display:inline-block;margin-bottom:8px}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .box h2{margin:0 0 10px;font-size:13px;color:var(--acc)}
  #drop{border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;
    cursor:pointer;transition:.2s;background:#0d1626}
  #drop:active,#drop.over{border-color:var(--acc);background:#132033}
  #drop .big{font-size:14px;margin-bottom:5px}
  #drop .small{font-size:11px;color:var(--dim)}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px}
  .slider-row{display:flex;align-items:center;gap:10px}
  input[type=range]{flex:1;-webkit-appearance:none;height:5px;border-radius:3px;
    background:#243149;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    border-radius:50%;background:var(--acc);cursor:pointer;border:3px solid #111a2b}
  .val{font-size:13px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;color:var(--acc);font-weight:600}
  .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .quick button{flex:1;min-width:60px;padding:7px 4px;font-size:11px;border-radius:7px;
    background:#0b1421;border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .quick button:active{border-color:var(--acc);color:var(--acc)}
  .btn{display:block;width:100%;padding:12px;font-size:14px;border-radius:9px;border:none;
    cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;margin-top:16px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  audio{width:100%;height:36px;margin-top:10px}
  .status{font-size:12px;min-height:18px;margin-top:10px;color:var(--dim)}
  .status.ok{color:var(--ok)}
  .status.err{color:#ff6b6b}
  #result{display:none}
  .ver{text-align:center;font-size:10px;color:#3d4a61;padding:20px 0}
  .hide{display:none}
  .tip{font-size:11px;color:var(--dim);line-height:1.7;margin-top:10px}
</style>
</head>
<body>

<header>
  <a class="back" href="../../">← 返回</a>
  <h1>🎚️ 变速变调</h1>
  <p>变速不变调 · 降 key 升 key · 本地处理</p>
</header>

<div class="wrap">

  <div class="box">
    <div id="drop">
      <div class="big">点这里选音频文件</div>
      <div class="small">支持 mp3 / wav / ogg / m4a / flac</div>
    </div>
    <input type="file" id="file" accept="audio/*" class="hide">
    <div id="fileInfo" class="status"></div>
  </div>

  <div class="box hide" id="editBox">
    <audio id="player" controls></audio>

    <h2 style="margin-top:16px">速度</h2>
    <div class="slider-row">
      <input type="range" id="speed" min="0.5" max="2" step="0.01" value="1">
      <span class="val" id="speedVal">1.00×</span>
    </div>
    <div class="quick" data-for="speed">
      <button data-v="0.75">0.75×</button>
      <button data-v="0.85">0.85×</button>
      <button data-v="1">1.00×</button>
      <button data-v="1.15">1.15×</button>
      <button data-v="1.25">1.25×</button>
    </div>

    <h2 style="margin-top:20px">变调（半音）</h2>
    <div class="slider-row">
      <input type="range" id="pitch" min="-12" max="12" step="1" value="0">
      <span class="val" id="pitchVal">0 半音</span>
    </div>
    <div class="quick" data-for="pitch">
      <button data-v="-5">-5</button>
      <button data-v="-3">-3</button>
      <button data-v="-2">-2</button>
      <button data-v="0">原调</button>
      <button data-v="2">+2</button>
      <button data-v="3">+3</button>
    </div>

    <button class="btn" id="go">开始处理</button>
    <div class="status" id="status"></div>
    <div class="tip">
      💡 变速用「时间伸缩」算法，变速后音高不变；变调用「相位声码器」重新合成，变调后速度不变。
      音频越长处理越慢，30 秒以内的音频通常在几秒内完成。
    </div>
  </div>

  <div class="box" id="result">
    <h2>✅ 处理完成</h2>
    <audio id="outPlayer" controls></audio>
    <a class="btn" id="dl" download>下载文件</a>
  </div>

  <div class="ver" id="ver"></div>
</div>

<script>
(function(){
  "use strict";
  var VERSION = "v1.0.0-变速变调初版 20261103";
  document.getElementById("ver").textContent = VERSION;

  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("file");
  var editBox = document.getElementById("editBox");
  var statusEl = document.getElementById("status");
  var fileInfo = document.getElementById("fileInfo");
  var player = document.getElementById("player");

  var buffer = null;
  var fileName = "";

  function st(msg, cls){ statusEl.textContent = msg; statusEl.className = "status" + (cls ? " " + cls : ""); }

  drop.addEventListener("click", function(){ fileInput.click(); });
  drop.addEventListener("dragover", function(e){ e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function(){ drop.classList.remove("over"); });
  drop.addEventListener("drop", function(e){
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", function(){
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(f){
    if (!/^audio\//.test(f.type) && !/\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(f.name)) {
      fileInfo.textContent = "❌ 这不像音频文件"; fileInfo.className = "status err"; return;
    }
    fileName = f.name.replace(/\.[^.]+$/, "");
    fileInfo.textContent = "读取中：" + f.name + "（" + (f.size/1048576).toFixed(1) + " MB）";
    fileInfo.className = "status";

    var reader = new FileReader();
    reader.onload = function(){
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.decodeAudioData(reader.result.slice(0))
        .then(function(buf){
          buffer = buf;
          fileInfo.textContent = "✅ " + f.name + " · " + buf.duration.toFixed(1) + " 秒 · " + buf.numberOfChannels + " 声道";
          fileInfo.className = "status ok";
          editBox.classList.remove("hide");
          player.src = URL.createObjectURL(f);
        })
        .catch(function(err){
          fileInfo.textContent = "❌ 解不开这个格式（" + (err.message || err) + "）";
          fileInfo.className = "status err";
        });
    };
    reader.readAsArrayBuffer(f);
  }

  /* ---------- 滑块 ---------- */
  var speed = document.getElementById("speed"), speedVal = document.getElementById("speedVal");
  var pitch = document.getElementById("pitch"), pitchVal = document.getElementById("pitchVal");

  speed.addEventListener("input", function(){ speedVal.textContent = (+speed.value).toFixed(2) + "×"; });
  pitch.addEventListener("input", function(){
    var v = +pitch.value;
    pitchVal.textContent = (v > 0 ? "+" : "") + v + " 半音";
  });

  document.querySelectorAll(".quick").forEach(function(g){
    var target = document.getElementById(g.dataset.for);
    g.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        target.value = b.dataset.v;
        target.dispatchEvent(new Event("input"));
      });
    });
  });

  /* ---------- 重采样（变速不变调用） ---------- */
  function resample(data, fromRate, toRate){
    var ratio = toRate / fromRate;
    var newLen = Math.round(data.length * ratio);
    var out = new Float32Array(newLen);
    for (var i = 0; i < newLen; i++) {
      var pos = i / ratio;
      var i0 = Math.floor(pos), i1 = Math.min(i0 + 1, data.length - 1);
      var frac = pos - i0;
      out[i] = data[i0] * (1 - frac) + data[i1] * frac;
    }
    return out;
  }

  /* ---------- 相位声码器变调 ---------- */
  function pitchShift(channels, sampleRate, semitones){
    if (semitones === 0) return channels;
    var factor = Math.pow(2, semitones / 12);

    // 简易实现：用 OfflineAudioContext 的重采样 + 时间伸缩
    // 1) 变速播放（用重采样，音高会跟着变）
    // 2) 再用时间伸缩拉回原长度
    var resampled = channels.map(function(ch){
      return resample(ch, sampleRate, sampleRate * factor);
    });

    // 时间伸缩：用 WSOLA 简化版
    var stretched = resampled.map(function(ch){
      return timeStretch(ch, factor);
    });
    return stretched;
  }

  /* ---------- WSOLA 简易时间伸缩 ---------- */
  function timeStretch(data, rate){
    // rate > 1 表示要压缩时间
    if (Math.abs(rate - 1) < 0.001) return data;
    var outLen = Math.round(data.length / rate);
    var out = new Float32Array(outLen);
    var frame = 1024;
    var hop = 256;
    var overlap = frame - hop;

    var win = new Float32Array(frame);
    for (var i = 0; i < frame; i++) {
      win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (frame - 1));
    }

    var outPos = 0, inPos = 0;
    while (outPos + frame < outLen && inPos + frame < data.length) {
      for (var i = 0; i < frame; i++) {
        out[outPos + i] += data[inPos + i] * win[i];
      }
      outPos += hop;
      inPos += Math.round(hop * rate);
    }
    return out;
  }

  /* ---------- WAV 编码 ---------- */
  function encodeWav(buffers, sampleRate){
    var numCh = buffers.length;
    var len = buffers[0].length;
    var bytes = 44 + len * numCh * 2;
    var ab = new ArrayBuffer(bytes);
    var view = new DataView(ab);
    function str(off, s){ for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
    str(0, "RIFF"); view.setUint32(4, bytes - 8, true);
    str(8, "WAVE"); str(12, "fmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, numCh, true); view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numCh * 2, true);
    view.setUint16(32, numCh * 2, true); view.setUint16(34, 16, true);
    str(36, "data"); view.setUint32(40, len * numCh * 2, true);

    var off = 44;
    for (var i = 0; i < len; i++) {
      for (var c = 0; c < numCh; c++) {
        var s = Math.max(-1, Math.min(1, buffers[c][i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
    }
    return new Blob([ab], {type:"audio/wav"});
  }

  /* ---------- 主流程 ---------- */
  document.getElementById("go").addEventListener("click", function(){
    if (!buffer) return;
    var sp = +speed.value;
    var semis = +pitch.value;
    var btn = this; btn.disabled = true;

    st("处理中…长音频可能要几十秒，别关页面");
    setTimeout(function(){
      try {
        var sr = buffer.sampleRate;
        var chans = [];
        for (var c = 0; c < buffer.numberOfChannels; c++) {
          chans.push(Float32Array.from(buffer.getChannelData(c)));
        }

        // 1. 变调：先重采样再时间伸缩回去
        if (semis !== 0) {
          var factor = Math.pow(2, semis / 12);
          chans = chans.map(function(ch){
            var r = resample(ch, sr, sr * factor);
            return timeStretch(r, factor);
          });
        }

        // 2. 变速：重采样（变速不变调需要用时间伸缩）
        if (Math.abs(sp - 1) > 0.001) {
          chans = chans.map(function(ch){
            return timeStretch(ch, sp);
          });
        }

        var blob = encodeWav(chans, sr);
        var url = URL.createObjectURL(blob);

        document.getElementById("outPlayer").src = url;
        var dl = document.getElementById("dl");
        dl.href = url;
        dl.download = fileName + "_变速" + sp.toFixed(2) + "_变调" + semis + ".wav";
        document.getElementById("result").style.display = "block";

        st("✅ 完成 · " + (chans[0].length/sr).toFixed(1) + " 秒 · " + (blob.size/1048576).toFixed(2) + " MB", "ok");
        document.getElementById("result").scrollIntoView({behavior:"smooth"});
      } catch (e) {
        st("❌ 出错了：" + e.message, "err");
      } finally {
        btn.disabled = false;
      }
    }, 30);
  });
})();
</script>
</body>
</html>
